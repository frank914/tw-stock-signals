<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股訊號儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft JhengHei", "Segoe UI", sans-serif;
    background: #0b1020;
    color: #e5e7eb;
    min-height: 100vh;
    padding: 0 12px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header {
    padding: 20px 0;
    border-bottom: 1px solid #1e293b;
    text-align: center;
  }
  h1 { font-size: 22px; color: #fbbf24; }
  .subtitle { font-size: 13px; color: #94a3b8; margin-top: 6px; }

  #login {
    text-align: center;
    padding: 60px 20px;
  }
  #login input {
    background: #1a2238; color: #fff; border: 1px solid #475569;
    padding: 10px 16px; border-radius: 6px; font-size: 16px;
    width: 240px; max-width: 100%;
  }
  #login button {
    background: #fbbf24; color: #0b1020; border: 0; padding: 10px 24px;
    border-radius: 6px; font-size: 16px; cursor: pointer; margin-left: 8px;
    font-weight: bold;
  }
  #login button:hover { background: #f59e0b; }
  #err { color: #ef4444; margin-top: 12px; min-height: 1.5em; }

  .tabs {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin: 20px 0; padding-bottom: 8px;
    border-bottom: 1px solid #1e293b; overflow-x: auto;
  }
  .tab {
    background: #1a2238; color: #94a3b8; border: 1px solid #1e293b;
    padding: 8px 14px; border-radius: 6px 6px 0 0; cursor: pointer;
    font-size: 13px; white-space: nowrap;
  }
  .tab.active { background: #fbbf24; color: #0b1020; font-weight: bold; }
  .tab:hover:not(.active) { background: #2a3550; color: #fff; }

  section { display: none; padding: 4px 0; }
  section.active { display: block; }
  section h2 {
    font-size: 16px; color: #fbbf24; margin-bottom: 4px;
  }
  section .meta {
    font-size: 12px; color: #94a3b8; margin-bottom: 14px;
  }

  .stock {
    background: #13182a; border: 1px solid #1e293b; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .stock-head {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 4px;
  }
  .stock-name { font-size: 15px; font-weight: bold; color: #f1f5f9; }
  .stock-name .rank {
    background: #475569; color: #fff; padding: 1px 6px; border-radius: 4px;
    font-size: 11px; margin-right: 6px;
  }
  .ticker { font-size: 12px; color: #94a3b8; margin-left: 6px; }
  .price { font-size: 15px; color: #10b981; font-weight: bold; }
  .score {
    background: #fbbf24; color: #0b1020; padding: 2px 8px;
    border-radius: 4px; font-size: 12px; font-weight: bold;
    margin-left: 6px;
  }
  .stock-meta {
    color: #94a3b8; font-size: 12px; margin-top: 6px;
    line-height: 1.6;
  }
  .tags { margin-top: 4px; }
  .tag {
    display: inline-block; background: #1e293b; color: #fbbf24;
    font-size: 11px; padding: 2px 6px; border-radius: 3px; margin: 1px 2px;
  }
  .rec-strong { color: #fbbf24; font-weight: bold; }
  .rec-recommend { color: #10b981; }
  .rec-watch { color: #94a3b8; }

  .warn-stock { border-left: 3px solid #ef4444; padding-left: 10px; }
  .attn-stock { border-left: 3px solid #f59e0b; padding-left: 10px; }
  .status-bar {
    background: #1a2238; padding: 10px 14px; border-radius: 8px;
    margin: 10px 0; font-size: 13px; color: #94a3b8;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .expiry-ok { color: #10b981; }
  .expiry-warn { color: #f59e0b; font-weight: bold; }
  .logout {
    margin-left: auto; background: #475569; color: #fff; border: 0;
    padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  .logout:hover { background: #64748b; }

  footer {
    text-align: center; color: #475569; font-size: 11px;
    padding: 30px 0 16px; margin-top: 20px;
  }

  @media (max-width: 600px) {
    h1 { font-size: 18px; }
    .stock-name { font-size: 14px; }
    .price { font-size: 14px; }
  }
</style>
</head>

  const isToken = !!TOKENS[tokenInput];
  const bundleStr = isToken
    ? decryptCryptoJS(TOKENS[tokenInput], tokenInput)
    : decryptCryptoJS(TOKENS['__BACKUP__'], tokenInput);
  if (!bundleStr) {
    if (!silent) {
      err.textContent = '❌ Token 錯誤';
      document.getElementById('pwd').value = '';
    }
    return false;
  }
  let bundle;
  try { bundle = JSON.parse(bundleStr); }
  catch(e) {
    if (!silent) err.textContent = '❌ 資料格式錯誤';
    return false;
  }
  // 3. 用 master_key 解 data
  const dataStr = decryptCryptoJS(ENCRYPTED_DATA, bundle.k);
  if (!dataStr) {
    if (!silent) err.textContent = '❌ 資料解密失敗';
    return false;
  }
  let data;
  try { data = JSON.parse(dataStr); }
  catch(e) {
    if (!silent) err.textContent = '❌ 資料格式錯誤';
    return false;
  }

  // 成功
  err.textContent = '';
  localStorage.setItem('tok', tokenInput);  // 持久化
  renderDashboard(data, bundle);
  checkNewSignal(GENERATED_AT);
  return true;
}

function doLogin() {
  const tokenInput = document.getElementById('pwd').value.trim().toUpperCase();
  tryLogin(tokenInput, false);
}

function logout() {
  localStorage.removeItem('tok');
  location.reload();
}

function calcDaysLeft(expiry) {
  if (!expiry) return null;
  try {
    const today = new Date();
    today.setHours(0,0,0,0);
    const exp = new Date(expiry + 'T00:00:00');
    return Math.round((exp - today) / 86400000);
  } catch(e) { return null; }
}

function checkNewSignal(generatedAt) {
  // 跟上次看到的比 — 不同就跳桌面通知
  const lastSeen = localStorage.getItem('lastSeen');
  if (lastSeen && lastSeen !== generatedAt) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('📊 台股訊號已更新', {
        body: '最新訊號 ' + generatedAt + ',點開看完整內容',
        icon: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ctext y=%22.9em%22 font-size=%2220%22%3E📊%3C/text%3E%3C/svg%3E'
      });
    }
  }
  localStorage.setItem('lastSeen', generatedAt);
}

function requestNotifyPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function renderDashboard(data, bundle) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  // 訂閱狀態列
  const statusBar = document.getElementById('statusBar');
  if (statusBar && bundle) {
    const days = calcDaysLeft(bundle.e);
    let statusHtml = '👤 ' + (bundle.n || '訂閱者');
    if (days !== null) {
      const cls = days <= 7 ? 'expiry-warn' : 'expiry-ok';
      statusHtml += '  <span class="' + cls + '">· 剩 ' + days + ' 天</span>';
      if (days <= 7) statusHtml += '  <span class="expiry-warn">⚠️ 即將到期</span>';
    } else if (bundle.e === "") {
      statusHtml += '  <span class="expiry-ok">· 管理員</span>';
    }
    statusHtml += '  <button onclick="logout()" class="logout">登出</button>';
    statusBar.innerHTML = statusHtml;
  }

  const tabs = document.getElementById('tabs');
  const sections = document.getElementById('sections');
  tabs.innerHTML = ''; sections.innerHTML = '';

  data.sections.forEach((sec, idx) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (idx === 0 ? ' active' : '');
    tab.textContent = sec.title;
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('sec-' + idx).classList.add('active');
    };
    tabs.appendChild(tab);

    const section = document.createElement('section');
    section.id = 'sec-' + idx;
    if (idx === 0) section.className = 'active';
    let html = `<h2>${sec.title}</h2>
                <div class="meta">產生於 ${sec.generated_at} · ${sec.stocks.length} 檔</div>`;

    sec.stocks.forEach(s => {
      let recClass = '';
      let extraInfo = '';
      if (s.rec_tag) {
        if (s.rec_level === 'strong') recClass = 'rec-strong';
        else if (s.rec_level === 'recommend') recClass = 'rec-recommend';
        else recClass = 'rec-watch';
      }
      let warnClass = '';
      if (s.type === 'punish') warnClass = 'warn-stock';
      else if (s.type === 'attention') warnClass = 'attn-stock';

      if (s.type) {
        html += `<div class="stock ${warnClass}">
                   <div class="stock-head">
                     <div class="stock-name">${s.name} <span class="ticker">${s.ticker}</span></div>
                   </div>
                   <div class="stock-meta">${s.info || ''}</div>
                 </div>`;
        return;
      }

      const rankBadge = s.rank ? `<span class="rank">#${s.rank}</span>` : '';
      const recHtml = s.rec_tag ? `<div class="${recClass}">${s.rec_tag}</div>` : '';

      const tagsHtml = s.tags && s.tags.length
        ? `<div class="tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`
        : '';

      let metaLines = [];
      if (s.score) metaLines.push(`分 <b>${s.score}</b>`);
      if (s.rating) metaLines.push(s.rating);
      if (s.trend) metaLines.push(s.trend);
      if (s.gain_2w_pct != null) metaLines.push(`2週 +${s.gain_2w_pct}%`);
      if (s.today_change_pct != null) metaLines.push(`今日 ${s.today_change_pct >= 0 ? '+' : ''}${s.today_change_pct}%`);
      if (s.today_gain_pct != null) metaLines.push(`昨日 +${s.today_gain_pct}%`);
      if (s.ret_5d_pct != null) metaLines.push(`5日 ${s.ret_5d_pct >= 0 ? '+' : ''}${s.ret_5d_pct}%`);
      if (s.ret_20d_pct != null) metaLines.push(`20日 ${s.ret_20d_pct >= 0 ? '+' : ''}${s.ret_20d_pct}%`);
      if (s.ret_1m != null) metaLines.push(`月漲 ${s.ret_1m >= 0 ? '+' : ''}${s.ret_1m.toFixed(1)}%`);
      if (s.retr_pct != null) metaLines.push(`FIB ${s.retr_pct}%`);
      if (s.rsi) metaLines.push(`RSI ${Math.round(s.rsi)}`);
      if (s.sector) metaLines.push(s.sector);
      if (s.signals) metaLines.push(s.signals.join(' · '));

      let planHtml = '';
      if (s.plan && s.plan.entry_zone) {
        const ez = s.plan.entry_zone;
        planHtml = `<div class="stock-meta">📍 進場 $${ez[0]}~${ez[1]} · 🛑 止損 $${s.plan.stop_loss} · 🎯 目標 $${s.plan.tp1} → $${s.plan.tp2} → $${s.plan.tp3}</div>`;
      } else if (s.stop_loss != null) {
        planHtml = `<div class="stock-meta">🛑 止損 $${s.stop_loss} · 🎯 目標 $${s.target1} → $${s.target2} · R:R ${s.rr}</div>`;
      }

      html += `<div class="stock">
                 <div class="stock-head">
                   <div class="stock-name">${rankBadge}${s.name} <span class="ticker">${s.ticker}</span></div>
                   <div class="price">$${s.price}</div>
                 </div>
                 ${recHtml}
                 <div class="stock-meta">${metaLines.join(' · ')}</div>
                 ${planHtml}
                 ${tagsHtml}
               </div>`;
    });

    section.innerHTML = html;
    sections.appendChild(section);
  });
}

// 自動嘗試載 session 密碼
window.addEventListener('DOMContentLoaded', () => {
  // 自動載入存的 token (localStorage 持久化)
  const saved = localStorage.getItem('tok');
  if (saved) {
    document.getElementById('pwd').value = saved;
    if (tryLogin(saved, true)) {
      // 成功登入 → 順便問通知權限
      requestNotifyPermission();
    } else {
      // 失敗(過期等) → 清掉,顯示登入畫面
      localStorage.removeItem('tok');
      document.getElementById('err').textContent =
        '⚠️ 你之前的 Token 已失效(過期或被撤銷),請重新輸入新的';
    }
  }
});
</script>
